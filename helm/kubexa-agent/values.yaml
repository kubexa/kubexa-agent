# Default values for kubexa-agent.
# Values map 1:1 to pkg/config.Config (see templates/configmap.yaml).

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/kubexa/kubexa-agent
  tag: "" # defaults to Chart.appVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  # Grant read on every apiGroup and resource, CRDs included. This is the
  # companion to a query rule with `resources: ["*"]`: that rule tells the
  # agent the platform may read anything, and without this the API server
  # still answers RBAC_DENIED for every type the generated rules do not name.
  #
  # Off by default, and deliberately NOT derived from query.rules: the agent's
  # config can be supplied as a mounted file this chart never sees, in which
  # case the template would find no rules and silently render the narrow role.
  readAll: false
  # Extra ClusterRole rules appended to the generated role.
  extraRules: []
  # The generated ClusterRole grants read access to the resource block below
  # when EITHER collect.state.enabled OR query.enabled is true -- the state
  # collector and live resource query are independent features that read the
  # same objects, and gating on one alone left the other with RBAC_DENIED.

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# Singleton deployment: the agent must run exactly one replica per cluster.
# Multiple replicas duplicate logs, state events, and metrics to the gateway
# (no leader election). replicas is fixed at 1 in templates/deployment.yaml.

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Persistent volume for buffer spill and log checkpoints.
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# Sensitive values — prefer existingSecret in production.
secret:
  create: true
  # Use an existing Secret instead of creating one (key: tenant-token).
  existingSecret: ""
  existingSecretKey: tenant-token
  # Inline token used only when secret.create=true and existingSecret="".
  # Override at install: --set secret.tenantToken=<token> or use secret.existingSecret.
  tenantToken: "CHANGEME"

# Go runtime soft memory limit (GOMEMLIMIT).
#
# Leave empty to derive it from resources.limits.memory below. Without it the
# Go runtime cannot see the container limit and targets a heap of twice the live
# heap regardless of it -- which is how a 512Mi agent came to sit at 432 MB RSS
# and get OOMKilled 8 times. See the kubexa-agent.goMemLimit helper for the
# measurements and for why a soft limit is the right trade.
#
#   ""      derive: goMemLimitPercent of resources.limits.memory
#   "off"   do not set GOMEMLIMIT at all
#   other   used verbatim, e.g. "400MiB" or a plain byte count
#
# Setting GOMEMLIMIT in `env` below also wins; the chart will not add a second.
goMemLimit: ""
goMemLimitPercent: 75

# Optional env overrides (see pkg/config applyEnvOverrides).
# Example: KUBEXA_GATEWAY_ADDRESS, KUBEXA_LOG_LEVEL
env: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# ─── agent config (config.yaml) ─────────────────────────────────────────────

agent:
  # tenant_token is injected via KUBEXA_TENANT_TOKEN from Secret — leave empty here.
  tenantToken: ""
  agentId: ""
  # cluster_id is not configurable; derived at runtime from the kube-system namespace UID.

gateway:
  # Full host:port address. When set, overrides gateway.host/port.
  address: ""
  host: gateway.kubexa.dev
  port: 443
  tls: true
  insecureSkipVerify: false
  caCertPath: ""
  reconnectInitialDelay: 1s
  reconnectMaxDelay: 15s
  dialTimeout: 10s
  handshakeTimeout: 10s

collect:
  logs:
    enabled: true
    tailLines: 100
    follow: true
    checkpointDir: /var/lib/kubexa/log-checkpoints
    excludeNamespaces:
      - kube-system
      - kube-public
    # NOTE -- keys inside `rules` are snake_case, unlike every chart value
    # around them. This list is copied into the agent's config file verbatim
    # (toYaml), so its keys are the agent's OWN config keys: pod_names, not
    # podNames. A key the agent does not know is dropped without failing the
    # install, and a rule that lost its filters collects EVERYTHING in its
    # namespace -- so the mistake shows up as an over-broad rule, never as a
    # typo. Agent images that carry the startup check log `unrecognized config
    # key ignored` for each one; the appVersion this chart pins today (0.7.3)
    # predates it and says nothing. Same for collect.state.rules,
    # collect.metrics.rules, collect.metrics.customEndpoints and query.rules
    # below.
    rules: []
    # Example:
    # rules:
    #   - id: prod-api
    #     namespace: production
    #     pod_names:
    #       - api-*
    #     label_selector: app=api
    #     containers:
    #       - api

  state:
    enabled: true
    resyncPeriod: 5m
    # redactSecrets: when false (the default), Secret values (data/stringData) are sent to
    # the gateway as-is and persisted by the Kubexa platform, so cluster admins/owners can
    # view them in the resource explorer. Set to true if this installation must never let
    # Secret values leave the cluster; managedFields and the
    # kubectl.kubernetes.io/last-applied-configuration annotation are always stripped from
    # every object regardless of this setting.
    redactSecrets: false
    rules:
      - id: cluster-core
        namespace: ""
        resources:
          - pods
          - services
          - deployments
          - secrets

  metrics:
    enabled: true
    podInterval: 30s
    nodeInterval: 30s
    kubeMetrics: false
    rules:
      - id: cluster-metrics
        namespace: ""
        resources:
          - pods
          - nodes
    customEndpoints: []
    # Example:
    # customEndpoints:
    #   - name: my-app
    #     url: http://my-app.metrics.svc:8080/metrics
    #     interval: 30s
    #     extra_labels:
    #       service: my-app

# Live, on-demand resource reads requested by the Kubexa platform — distinct
# from collect.state, which governs continuous streaming. Where collect.state
# pushes a running feed of changes, query answers a single point-in-time
# question asked by the UI (e.g. "show me this Deployment now").
#
# Omitting this whole section inherits collect.state entirely. Inheritance is
# PER-FIELD, not all-or-nothing: setting only redactSecrets here still
# inherits rules from collect.state.rules, and vice versa.
#
# rules: [] (the default below) inherits collect.state.rules too — it does
# NOT mean "deny everything". To actually deny all live queries, set
# enabled: false instead.
#
# Each rule:
#   namespace: ""  matches every namespace AND cluster-scoped resources.
#                  "team-*" prefix matching is also supported.
#   names:         entries accept a trailing "*" only (e.g. "be-*"), no other
#                  globbing.
#   resources:     built-in kinds by plural name (pods, services, ...); CRDs
#                  must be given as the full group/version/resource, e.g.
#                  monitoring.coreos.com/v1/prometheusrules.
#   verbs:         omit for both list and get. This restricts which
#                  OPERATIONS are permitted, not how much of an object comes
#                  back — e.g. verbs: [list] on secrets still returns full
#                  Secret data/stringData on a full-view list, it only blocks
#                  fetching a single Secret by name via get. redactSecrets is
#                  the only setting that strips Secret data/stringData.
query:
  enabled: true
  # redactSecrets: false   # unset inherits collect.state.redactSecrets
  #
  # Listing NAMED rules here replaces the collect.state inheritance -- an
  # empty list inherits, a non-empty one does not. Reading metrics.k8s.io for
  # the cpu/memory columns is granted implicitly, but only where the rules
  # already in force say so: every rule here (or, when this list is empty,
  # inherited from collect.state.rules) that permits listing pods or nodes
  # gets a matching metrics.k8s.io grant carrying that same rule's namespace,
  # names and label selector -- so the columns never reach a namespace or
  # object the listing itself does not already reach. It must NOT be written
  # here directly: doing so would make this list non-empty and silently drop
  # the inherited object rules.
  #
  # A rule may name `"*"` as its only resource, which permits every
  # group/version/resource including CRDs. It covers secrets too -- set
  # redactSecrets: true unless you specifically need values readable. Pair it
  # with rbac.readAll above, or the API server refuses everything the
  # generated role does not already name.
  #
  # UPGRADE NOTE (chart versions that added the `"*"` wildcard): only the bare
  # `"*"` is a wildcard. A PARTIAL form -- `"apps/v1/*"`, `"apps/*"` -- is now
  # rejected at startup and the agent exits, here and in collect.state.rules
  # alike. Earlier versions accepted such an entry and silently matched
  # nothing, so a rule you believed was in force never was. If your agent
  # crash-loops after upgrading with a "not a supported resource" message,
  # replace the partial form with the resources it was meant to name (or with
  # the bare `"*"`).
  rules: []
  #  - namespace: stage
  #    resources: [pods]
  #    names: ["be-*"]
  #    verbs: [list, get]

buffer:
  maxMemoryBytes: 67108864 # 64 MiB
  spillDir: /var/lib/kubexa/spill
  maxDiskBytes: 536870912 # 512 MiB
  batchSize: 100
  flushInterval: 1s

observability:
  metricsAddr: ":9090"
  healthAddr: ":8080"
  # Go profiling (/debug/pprof). EMPTY MEANS OFF, and off is the right default:
  # a heap dump from this agent contains unredacted Secret values held in the
  # state watcher's informer cache and raw log lines from every collected pod.
  #
  # Turn it on only while investigating, and only on loopback:
  #
  #   --set observability.pprofAddr=127.0.0.1:6060
  #
  # Loopback keeps it off the cluster network entirely while `kubectl
  # port-forward` still reaches it, because port-forward attaches to the pod's
  # own network namespace:
  #
  #   kubectl -n <ns> port-forward pod/<agent-pod> 6060:6060
  #   go tool pprof -http=: http://127.0.0.1:6060/debug/pprof/heap
  #
  # Binding anything else (":6060", "0.0.0.0:6060") publishes those dumps to
  # every pod in the cluster. This port is deliberately absent from the Service
  # and from the container's declared ports; both would advertise an exposure
  # that is not intended.
  pprofAddr: ""

log:
  level: info
  format: json

# ClusterIP Service exposing agent health and self-metrics endpoints.
service:
  enabled: true
  type: ClusterIP
  annotations: {}
  metricsPort: 9090
  healthPort: 8080

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
