apiVersion: v2
name: kubexa-agent
description: Kubexa agent — collects Kubernetes logs, state, and metrics and streams them to the Kubexa gateway.
type: application
# 0.7.2 changes no template: appVersion moves to 0.7.2, which stops the WAL's
# byte cap from rejecting delivery-ack records. Observed live on e12-preprod at
# 0.7.1: the spill file sat at 536870879 bytes under a 536870912 cap -- 33 bytes
# free, an ack record needs 45 -- so no ack could be persisted, every delivered
# item was replayed and nacked back, and the queue could never drain. An ack is
# the only record that makes space reclaimable, so it is now exempt from the
# cap; items are not. No install order constraint: the gateway is unaffected.
version: 0.7.2
appVersion: "0.7.2"
keywords:
  - kubexa
  - observability
  - kubernetes
  - monitoring
home: https://github.com/kubexa/kubexa-agent
sources:
  - https://github.com/kubexa/kubexa-agent
maintainers:
  - name: Kubexa
    url: https://github.com/kubexa
