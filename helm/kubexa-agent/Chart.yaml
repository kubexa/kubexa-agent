apiVersion: v2
name: kubexa-agent
description: Kubexa agent — collects Kubernetes logs, state, and metrics and streams them to the Kubexa gateway.
type: application
# 0.9.1 moves the image to 0.9.1: node console fixes from the whole-branch
# review. rbac.nodeShell now also grants `nodes get` in the ClusterRole --
# the agent confirms the node exists before it creates a privileged Pod on
# it, and that read used to come only from the state/query or cAdvisor
# blocks, so an install with every read feature off answered RBAC_DENIED to
# every node open. The boot-time helper sweep logs its count ("node shell
# sweep complete removed=N"), and the openNode comment now states the real
# helper-lifecycle layers (no shutdown hook: an agent that dies mid-session
# leaves the helper to ownerReference GC, the next boot's sweep, or
# activeDeadlineSeconds). Pairs with apiserver/agentserver charts on image
# 0.5.41 (node attach deadline; error_code on cluster_console_sessions).
#
# 0.9.0 moves the image to 0.9.0: node console through a privileged helper
# Pod. Three gates, all OFF: rbac.nodeShell, exec.node.enabled, and the
# platform permission.
#   - rbac.nodeShell grants the ServiceAccount a Role (not a ClusterRole --
#     the helper Pod lives beside the agent) scoped to THIS release's
#     namespace: create/get/list/watch/delete on pods. It also widens the
#     existing pods/exec ClusterRole grant, now gated on
#     `rbac.exec OR rbac.nodeShell`, since a node console execs into the
#     helper Pod it creates. NOT derived from exec.node, the same reasoning
#     as rbac.exec, rbac.write and rbac.readAll: the agent config can be
#     mounted from a file this chart never sees.
#   - exec.node.enabled + exec.node.nodes/image/namespace/shell/
#     maxSessionSec/maxSessions/helperReadyTimeoutSec is the owner's policy:
#     which nodes, what image, and the session limits. image has no default
#     on purpose -- any image with `sleep` and `nsenter` works, and the
#     operator names one this cluster's nodes can pull.
#   - the platform's own cluster:node_console permission at admin level is
#     checked outside this chart entirely.
# Also new: POD_NAME/POD_NAMESPACE via the downward API, unconditional, so
# the helper Pod can carry an ownerReference back to the agent Pod (helpers
# are garbage-collected with the agent when exec.node.namespace is empty).
# Inert when exec.node is off.
#
# 0.8.0 moves the image to 0.8.0: the agent answers pod console sessions over
# a stream of its own -- opening a shell in a running container, resizing it,
# and resuming it across a proxy cut inside resume_window_sec. Two gates,
# both OFF:
#   - rbac.exec grants the ServiceAccount exactly what a console needs:
#     pods get (to resolve the default container) and pods/exec create (to
#     open the session). It is NOT derived from exec.pod, the same reasoning
#     as rbac.write and rbac.readAll: the agent config can be mounted from a
#     file this chart never sees, so a derived grant would render a narrow
#     Role while the policy said yes.
#   - exec.pod.enabled + exec.pod.rules is the owner's policy: which
#     namespaces, pod names and containers a session may open, passed
#     through verbatim (snake_case, the agent's keys). A rule with no fields
#     matches everything -- unlike mutate.rules, there is no separate empty-
#     grants-nothing convention here.
# Off by default in both places: rbac.exec absent leaves every exec_open
# RBAC_DENIED, and exec.pod.enabled: false refuses it before that, at the
# agent's own policy layer.
#
# 0.7.9 moves the image to 0.7.6: the agent answers mutation requests --
# patch, delete, restart, scale and create -- over the same stream it already
# streams telemetry on. Two independent gates decide every one, and both ship
# OFF:
#   - rbac.write grants the ServiceAccount the write verbs and the scale
#     subresource. It is NOT derived from mutate.rules, because the agent
#     config can be mounted from a file this chart never sees; a derived Role
#     would then be narrow while the policy said yes. Off: every write is
#     RBAC_DENIED by the customer's own API server.
#   - mutate.enabled + mutate.rules is the owner's policy, passed through
#     verbatim (snake_case, the agent's keys). A verb outside the rules is
#     POLICY_DENIED before anything touches the network. verbs is REQUIRED
#     on every rule and an empty list grants nothing -- the opposite of
#     query.rules -- and no resource entry may contain "*" in any form.
# The platform tells the two refusals apart, which is why they stay two
# flags. The handshake now advertises the capability, so a gateway older than
# the feature ignores it and a newer gateway refuses a mutation against an
# agent below 0.7.6 with an "upgrade the agent" answer, never a timeout.
# Also in 0.7.6: a rule's names: allowlist is consulted for an empty name too
# (before, an empty name skipped it and only client-go's own "name is
# required" stood in the way).
#
# 0.7.6 changes no image and one template line's worth of nothing: it finishes
# values.schema.json. 0.7.5 described the collect.* passthrough lists and the
# chart keys immediately around them; everything else that lands in the agent's
# config file -- agent, gateway, buffer, observability, log -- was still
# undescribed, so `--set gateway.dialTimeout=30` installed and the agent exited
# before it connected, and `--set gateway.dialTimout=5s` rendered nothing at all
# while reading like a setting that had taken effect. Those blocks are now
# described and closed, with the types the agent's own loader wants: a duration
# is a string, a byte count an integer, a string field any scalar.
#
# It also lifts a refusal 0.7.5 shipped by mistake. Outside the rule lists the
# template QUOTES a duration, so the agent parses the value's string form and a
# bare 0 arrives as "0" -- a valid zero duration, and the ordinary way to turn a
# resync off. 0.7.5 refused `collect.state.resyncPeriod: 0`. Inside a rule list
# nothing quotes anything and a number really is fatal, so the two positions
# keep different schemas.
#
# UPGRADE: a key under gateway/buffer/observability/log that this chart does not
# define now fails the upgrade by name instead of being ignored. Every such key
# was already doing nothing -- the template never read it -- so the fix is to
# delete it or correct the spelling; nothing that was in force stops working.
# appVersion stays 0.7.3.
#
# 0.7.5 changes no template and no image either: values.schema.json now
# describes the four collect.* passthrough lists and the chart keys around
# them, the way it already described query.rules. Before this, helm refused
# `query.rules[0].labelSelector` by name while accepting
# `collect.logs.rules[0].podNames` -- the same mistake, one caught before the
# install and one only visible later as a rule collecting its whole namespace.
# The schema also refuses a duration written as a number (`pod_interval: 30`),
# which the agent rejects at startup: helm now says no instead of rendering a
# CrashLoopBackOff, and it refuses an infix `*` in a query rule's namespace or
# names, which the agent also exits on. Everything else stays as permissive as
# the agent is: a string field accepts any scalar because yaml.v3 does, a blank
# value is allowed wherever yaml.v3 reads one as "not set", and `resources` is
# required only on query.rules -- state and metrics skip validation entirely
# while disabled, so a leftover rule there still installs.
#
# UPGRADE: this is the release where a rule written with the chart's old
# camelCase examples stops installing. If `helm upgrade` refuses it naming
# podNames (or labelSelector / extraLabels -- the wording differs before and
# after helm 3.18, the key does not), rename
# those keys to pod_names / label_selector / extra_labels -- the agent never
# read the camelCase spelling, so the rule was running without that filter.
# appVersion stays 0.7.3.
#
# 0.7.4 changes no template and no image: it corrects the values.yaml examples
# for the passthrough `rules` lists. Those lists are copied into the agent's
# config with toYaml, so their keys are the agent's own snake_case config keys
# (pod_names, label_selector, extra_labels) -- the examples showed podNames /
# labelSelector / extraLabels, which the agent drops in silence, leaving a rule
# with no filter that collects everything in its namespace. appVersion stays
# 0.7.3; the startup warning for unknown keys ships with the next image.
#
# 0.7.3 changed no template either; it moved appVersion to 0.7.3, which carries
# three fixes batched since 0.7.2:
#   - max_line_bytes was applied to the wire record's Raw field only, so the
#     Message field -- the one the consumer indexes and the one Loki caps at
#     256 KiB -- went out untrimmed.
#   - retireSegment returned early when the segment file was already gone and
#     subtracted nothing from totalBytes, so an agent could believe its disk
#     budget was spent while the disk was free: the state that deadlocked the
#     queue for 37 hours.
#   - kubexa_connection_reconnects_total was never incremented in production,
#     so the only metric that measures reconnects read 0 while the same process
#     logged 550 recv errors.
# No install order constraint: the gateway is unaffected.
#
# 0.7.7 is the first chart since 0.7.3 to move appVersion, and it moves it to
# 0.7.4 -- the image that finally carries what charts 0.7.4 and 0.7.5 were
# written for. Those two fixed the chart's own values (the passthrough rule keys
# are the agent's keys -- pod_names, label_selector, extra_labels -- not the
# chart's camelCase spellings) and gave values.schema.json the same
# additionalProperties gate over collect.* that query.rules already had. The
# schema half worked the moment the chart shipped, because helm enforces it.
# The other half needed a binary: pkg/config now decodes a second time with
# KnownFields(true) and cmd/agent prints `unrecognized config key ignored` with
# the line, the key and the struct that refused it. It WARNS, it does not
# refuse -- a stale key carried across an upgrade must not put a running agent
# into CrashLoopBackOff. Before this image a camelCase key was dropped in
# silence and the rule that lost its filter collected everything in the
# namespace.
#
# No install order constraint; the gateway is unaffected. Restarting the agent
# does not lose queued telemetry -- the disk queue survives the pod, and since
# 0.7.1 the gateway requeues whatever was in flight.
#
# 0.7.8 carries image 0.7.5, the first one that scrapes anything besides the
# Metrics API. It adds two collect.metrics endpoints and the values that
# configure them:
#   - collect.metrics.cadvisor scrapes each node's kubelet directly. Targets
#     are generated from the live node list and refreshed on
#     refreshInterval, so nothing here names a node and a new node is picked
#     up without an upgrade. The ClusterRole now includes nodes/metrics --
#     without it every target answers 401.
#   - collect.metrics.kubeStateMetrics scrapes a kube-state-metrics Service,
#     but probes for the Service FIRST. An absent installation is reported as
#     `not_installed`, which is a different thing from a scrape that returned
#     nothing, and the platform shows it as a different thing.
# Both default to enabled: false. Turning cadvisor on is the one to read the
# values.yaml comment for first: caFile defaults to the ServiceAccount CA,
# which signs the API server and NOT kubelet serving certificates, so on a
# cluster without serverTLSBootstrap every cAdvisor scrape fails
# `x509: certificate signed by unknown authority` until caFile or
# insecureSkipVerify is set.
#
# It also adds an advisory series budget (collect.metrics.maxSeries) and
# reports scrape health on every heartbeat, per kind and per target. No
# install order constraint against the gateway: an older gateway ignores the
# new heartbeat field, and a newer gateway reads its ABSENCE as "this agent
# does not report scrape health" rather than as "everything is fine".
# 0.9.4 moves the image to 0.9.4: the same code as 0.9.3 with a lint line
# fixed. Image 0.9.3 never built (the tag build failed on staticcheck), so
# chart 0.9.3 names an image that does not exist -- an install of it rolls
# back on ImagePullBackOff. Skip it.
# 0.9.3 moves the image to 0.9.3: config validation closes two silent
# shapes. exec.pod's scalars (resume_window_sec, max_session_sec, ...)
# are validated at load while exec.node is on, even with exec.pod.enabled
# false -- a node console shares them -- instead of failing boot as
# "policy is required". exec.node.max_session_sec must be at least
# exec.node.helper_ready_timeout_sec (defaults included): the session
# clock starts at open and the helper wait runs under it, so a shorter
# cap could only ever end as MAX_SESSION under the "starting helper" line;
# a per-open request below the wait is floored to it for the same reason.
# The boot sweep log names each namespace once. No template change.
# 0.9.2 moves the image to 0.9.2: a node console attaches to the gateway
# BEFORE its helper Pod is created and waited for. The helper wait now
# runs inside the session, under its max_session clock and resume window,
# so an image pull no longer burns the gateway's attach deadline and a
# browser that leaves mid-pull ends the session through Close or the
# resume window (helper deleted either way). Two lines appear in the
# terminal while it waits ("kubexa: starting node shell helper on <node>
# (<image>)..." then "kubexa: helper ready, entering host namespaces").
# Also: the kubexa.dev/node label fits Pod validation for node names over
# 63 characters; the boot sweep lists exec.node.namespace AND the release
# namespace; exec.node with an invalid exec.pod.rules entry fails boot
# naming the section. Pairs with apiserver/agentserver charts on image
# 0.5.42, which drop their 615/620 s node deadlines back to 15/20 s --
# install THIS chart first: an older agent on a 0.5.42 gateway ends every
# uncached node open as attach_timeout.
#
# 0.10.0 moves the image to 0.10.0: node operations -- cordon, uncordon and
# drain as a job with progress and cancellation (mutate.node.*,
# rbac.nodeOps). The agent's own pod is never evicted. Needs backend 0.5.44
# or newer for the platform side; older backends never dispatch a node job.
#
# 0.10.2 moves the image to 0.10.2: the live query policy grants list and
# get on namespaces implicitly, cluster-wide, unless an owner rule names
# namespaces itself. A default install inherits collect.state.rules, which
# never name namespaces, so the app's namespace picker (a live LIST) was
# refused with POLICY_DENIED on every load and fell back to the stored
# subset. The ClusterRole already granted namespaces; only the policy said
# no.
#
# 0.10.1 changes one default and no image: gateway.host is now
# agents.kubexa.dev, the hosted platform's real gateway. The old default,
# gateway.kubexa.dev, never had a DNS record, so an agent installed with
# the chart's defaults dialed a name that does not resolve and connected to
# nothing. A self-hosted platform still sets gateway.host to its own
# agentserver ingress host; the default only stops being a dead name.
# 0.10.3 moves the image to 0.10.3: on every accepted handshake the agent
# re-sends the latest snapshot of each node job it emitted in the last ten
# minutes. A stream can die before the peer notices, and the event just
# written into it -- seen live: a drain's FAILED/timeout -- never reaches
# the gateway; the platform then waited out its bound and recorded the
# finished job as lost. The gateway keeps only the latest snapshot per job,
# so a re-announcement is idempotent. Pairs with backend 0.5.46.
#
# 0.11.0 moves the image to 0.11.0: the Kubexa platform can own a small,
# fixed set of this agent's config blocks. The owner edits them in the app,
# the platform pushes them as the agent's OWN yaml over the config channel
# the handshake already carries, and the agent reports back on every
# heartbeat what it actually applied.
#
# NOTHING CHANGES ON AN EXISTING INSTALL until the platform actually owns a
# block for that cluster. With no owned blocks the agent runs exactly the
# config in this chart's values, as before. The platform half ships
# separately; a gateway that does not push managed blocks leaves this image
# inert, so 0.11.0 is safe to install ahead of it.
#
# Five blocks can be owned: collect.logs, collect.state, collect.metrics,
# query and buffer -- and within them only an explicit allowlist of keys.
# The allowlist is deliberately NARROWER than the agent's own structs, and
# that is the point of the feature rather than an omission:
#   - redact_secrets (on collect.state and on query) is NOT settable from
#     the platform, ever. It is the cluster owner's guarantee that Secret
#     values never leave this cluster, and that guarantee has to hold IN THE
#     AGENT, not only in the platform's own route -- a second gate is worth
#     nothing if the party it gates can open it. Both flags ride the
#     heartbeat so the owner can see what is in force.
#   - mutate.*, rbac and exec.* are not owned at all: write and console
#     authority stays in this chart's values and in the ServiceAccount.
#   - buffer's spill_dir, max_disk_bytes, max_memory_bytes and
#     flush_interval, and collect.metrics's custom_endpoints, cadvisor,
#     kube_state_metrics and kube_metrics stay with the operator too --
#     they describe the node this pod runs on, not a policy.
# A key outside the allowlist rejects the WHOLE block rather than being
# dropped: a partially applied block could silently lose the very key the
# owner was editing.
#
# What an operator sees on the heartbeat, all new: the applied revision, a
# config error if the agent refused a set, any warnings the config produced
# (today: a wildcard query rule with redaction off, the widest read policy
# this agent can hold), both redaction flags, and restart_required.
#
# READ THIS ONE IF YOU PUSH collect.* : restart_required means "part of this
# revision is still pending", not "nothing has happened". Two blocks are
# half-live. collect.state's rules feed the LIVE query read policy whenever
# query.rules is empty -- which is this chart's default, since query.rules
# ships commented out -- so a pushed collect.state changes what a live query
# may read on the very next request, while the informers keep running the
# old rules until a restart. collect.logs.enabled stops log DELIVERY the
# instant it goes false, while the tailer keeps running until a restart.
# Both are reported restart_required, and both are already partly in effect.
#
# Also: boot now starts the stream first and waits up to 10 s for the
# managed config before building collectors, so an agent whose blocks are
# owned does not first run the file config and then need a restart. A
# handshake that carries no config settles that wait immediately, so an
# agent nobody manages pays nothing for it. An unchanged set arriving on a
# reconnect does no work at all -- this deployment's stream is cut roughly
# every 150 s by design, and re-applying would mean a full capability sweep
# against the customer's API server every couple of minutes.
#
# An explicitly empty rule list is now REFUSED in every block that has one
# (`rules: []` and a valueless `rules:` alike). It used to widen to the
# permissive default, which is the opposite of what it reads like. Omit the
# key to keep the current rules, or set enabled: false to collect nothing.
#
# 0.11.1 changes no template and no Go code. It moves appVersion to 0.11.1,
# which is 0.11.0's code published as a multi-arch index (linux/amd64 +
# linux/arm64). The only files that moved are Dockerfile and
# .github/workflows/build.yaml.
#
# This is the image that matters most, because it is the only one installed
# into the CUSTOMER's cluster. amd64-only did not mean "we cannot demo on a
# Mac"; it meant an arm64 node pool -- Graviton, Ampere -- could not be
# monitored at all. The Dockerfile was fixed on 2026-10-13 (caca197): it had
# no `--platform=$BUILDPLATFORM`, `GOARCH=amd64` HARDCODED, and never declared
# TARGETARCH. That commit published nothing, because v0.11.0 predates it and
# build.yaml's `type=semver` rule only fires on refs/tags/*. A fixed Dockerfile
# is not a fixed image; this chart version exists to carry the tag that
# publishes one.
#
# Do not verify it on a Mac: Rosetta runs a wrong-architecture ELF and it
# prints its version, while `docker image inspect` reports the manifest and
# never the contents. On a real arm64 node it is `exec format error`. The
# build-time ELF guard in the Dockerfile is the check that holds, and it
# compares against a busybox from an unpinned `FROM alpine` stage rather than
# against $TARGETARCH -- comparing against the ARG the build itself used is
# self-consistent and blind.
#
# Rolling back to 0.11.0 is safe on amd64 and reinstates an image that cannot
# run on an arm64 node.
# 0.11.2 moves appVersion to 0.11.2 and annotates the pod for Prometheus /
# VictoriaMetrics pod discovery (service.scrapeAnnotations, default true).
# Both halves answer the same incident from the two sides it had.
#
# On 2026-10-26 apexcrawl's agent stopped exporting telemetry two minutes into
# a session and stayed stopped for 9.6 days, while every signal the platform
# had read healthy. Image 0.11.2 carries the two fixes:
#
#   - A session write that makes no progress no longer outlives its deadline.
#     The drain goroutine was parked inside grpc SendMsg on an 83,013-byte
#     message for 13,860 minutes. SendMsg takes no context of its own -- it
#     blocks on the HTTP/2 write quota, whose select watches only the stream's
#     done channel -- so the only interruption available is ending the
#     session, which is what sendOnSession now does after 30 s.
#     PAIRS WITH BACKEND IMAGE 0.5.68, whose gateway sheds a message after
#     15 s. The 15 is deliberately under this 30: the gateway gives up on one
#     message while the agent's session is still alive, costing a redelivery
#     rather than a reconnect. Either side alone still fixes the deadlock,
#     because both ends of it are now bounded.
#
#   - The agent counts what its queue REFUSES
#     (kubexa_queue_refused_total), and reports dropped+refused as its loss
#     figure on every heartbeat. All 6.93 million records lost in that
#     incident were refusals -- items Enqueue would not take, which the
#     collectors then discarded -- so kubexa_queue_dropped_total read 0, the
#     heartbeat reported 0 loss, and the queue health checker, which measures
#     a drop RATE, reported healthy for the entire 9.6 days.
#
# The chart half exists because none of those metrics were collected anywhere:
# nothing scraped this pod. Every agent image already serves /metrics on
# service.metricsPort, so the annotations take effect on whatever image is
# running. Umbrella 0.8.28 adds the two alert rules that read them
# (KubexaAgentExportStalled, KubexaAgentSendStalled).
#
# Turn scrapeAnnotations off only where something else already scrapes this
# pod (see serviceMonitor): a pod scraped twice reports every counter twice.
# 0.11.3 moves appVersion to 0.11.3. No template change; three fixes batched
# since 0.11.2, all of them about telemetry the agent reports about ITSELF.
#
#   - A reconnect no longer re-reads log lines the drain will certainly drop.
#     kubelet closes an idle log stream at streamingConnectionIdleTimeout
#     (4h0m0s, a documented default), so every quiet stream the agent opened at
#     startup dies as one synchronised cohort and re-opens together -- which is
#     what kept apexcrawl's drop counter rising by exactly 10 every four hours
#     for a month. The reconnect resumed from lastProcessed - 5s, and for a pod
#     silent longer than max_sample_age (168h deployed) that timestamp is
#     already expired, so the kubelet returned the ancient line and the drain's
#     age filter dropped it and COUNTED it. resumeSince now clamps the resume
#     point to now - max_sample_age. It cannot cost an ingestable line -- what
#     is older than the floor is what the filter would discard anyway.
#
#     Nothing was ever lost: those lines had been delivered a week earlier and
#     are in Loki. The cost was noise. 88 firing + 88 resolved for that alert
#     alone, three alerts flapping on the same four-hour clock, ~642
#     notifications in four weeks -- and the genuine 9.6-day export stall of
#     2026-10-26 had to compete with all of it. A false alarm on a timer is
#     what makes a true alarm unreadable.
#
#   - The label an alert selects on is now read by a test.
#     IncStreamError("send_stalled") had exactly one caller, inside a
#     time.AfterFunc, and that string is the whole input to
#     KubexaAgentSendStalled. No test read it, so a rename would have left this
#     package green and the rule permanently seriesless.
#
#   - The one-entry-per-message invariant that whole-batch age dropping rests
#     on is pinned at the producer. See the commit; it changes no behaviour and
#     exists so that introducing batching fails loudly instead of quietly
#     turning a whole-batch drop into data loss.
#
# No install order constraint; the gateway is unaffected.
# 0.11.4 moves appVersion to 0.11.4. No template change. It finishes 0.11.3's
# first fix, which covered one of the two paths that ask the Kubernetes log API
# for old lines.
#
# 0.11.3 floored the RECONNECT resume point. Deploying it on apexcrawl showed
# the other branch immediately: the new pod's age_too_old counter read 5 within
# three minutes of starting, where it should have read 0. streamCursor is
# in-memory only, so EVERY agent start takes the fresh-start branch for every
# stream -- the pod persists the queue it has not delivered on a PVC and
# deliberately forgets where it was reading. That branch bounds the read by
# tailLines (so no, a restart does not re-read a whole log history) but put no
# bound on the lines' AGE, and for a pod quiet longer than max_sample_age all
# of its last 100 lines are past the floor: read, enqueued, discarded, and
# reported to the platform as data loss.
#
# Same two arguments as before. It cannot cost an ingestable line, because a
# line older than the floor is one the age filter would discard anyway; and
# records that expire while waiting in the WAL still age out there and still
# count. What goes away is a loss figure for records that were never
# deliverable. A zero max_sample_age still changes nothing.
#
# No install order constraint; the gateway is unaffected.
# 0.11.5 moves appVersion to 0.11.5. No template change. It splits the label
# that made the two fixes above hard to confirm.
#
# kubexa_grpc_stream_errors_total{error_type="age_too_old"} counted two
# different events under one name: a line this agent re-read after it was
# already past the floor (nothing lost -- Loki holds it from the first
# delivery), and a line that was inside the floor when queued and expired
# waiting to be delivered (that one IS loss). Only the second deserves
# attention, and one label for both is why a month of self-inflicted re-reads
# read as data loss, and why the residue after 0.11.4 could only be attributed
# from a startup log line rather than measured.
#
# The drop site already has what it needs: queue.Item.EnqueuedAt, which
# internal/queue writes into each spill segment and reads back on recovery, so
# a recovered spill item is classified correctly too. If it is missing the drop
# counts as loss -- the only default that cannot HIDE loss.
#
#   age_too_old            (retired)
#   age_too_old_on_read    already past the floor when queued; not loss
#   age_too_old_in_queue   expired while waiting; this is loss
#
# Both values are new on purpose. Nothing in the platform matched the old one
# -- no alert rule and no screen, checked across all five repositories -- so a
# dashboard query that kept working while its meaning narrowed would be worse
# than one that returns nothing and sends its reader to look.
#
# The heartbeat's cumulative is deliberately NOT split, so
# KubexaAgentDropsTooOld fires on exactly what it fired on before: narrowing it
# would change an alert's meaning across a version boundary in another
# repository, and any age drop still deserves a look. Attribution is now a
# question the agent's own series answers, which is where it was needed.
#
# It also stops three HTTP servers holding a terminating pod open. A graceful
# http.Server.Shutdown waits for every connection to go idle, and a scraper's
# or the kubelet's keep-alive connection is sometimes not seen as idle at all:
# measured roughly one run in 25 waiting out the whole five-second budget
# against ~40us otherwise, and 30 out of 30 fast once the client's idle
# connections were closed first. /metrics is scraped by VictoriaMetrics and
# /healthz is probed by the kubelet, both over keep-alive, so this was a
# production path -- invisible because cmd/agent treats a DeadlineExceeded as a
# clean close. All three servers (metrics, health, pprof) now warn and force
# the connections closed instead of returning a swallowed error. The budget
# itself is unchanged: five seconds of a terminating pod, 4% of the time, in
# parallel with every other component's shutdown, did not justify shortening a
# window a long pprof profile legitimately uses.
#
# No install order constraint; the gateway is unaffected.
version: 0.11.5
appVersion: "0.11.5"
keywords:
  - kubexa
  - observability
  - kubernetes
  - monitoring
home: https://github.com/kubexa/kubexa-agent
sources:
  - https://github.com/kubexa/kubexa-agent
maintainers:
  - name: Kubexa
    url: https://github.com/kubexa
