apiVersion: v2
name: kubexa-agent
description: Kubexa agent — collects Kubernetes logs, state, and metrics and streams them to the Kubexa gateway.
type: application
# 0.9.1 moves the image to 0.9.1: node console fixes from the whole-branch
# review. rbac.nodeShell now also grants `nodes get` in the ClusterRole --
# the agent confirms the node exists before it creates a privileged Pod on
# it, and that read used to come only from the state/query or cAdvisor
# blocks, so an install with every read feature off answered RBAC_DENIED to
# every node open. The boot-time helper sweep logs its count ("node shell
# sweep complete removed=N"), and the openNode comment now states the real
# helper-lifecycle layers (no shutdown hook: an agent that dies mid-session
# leaves the helper to ownerReference GC, the next boot's sweep, or
# activeDeadlineSeconds). Pairs with apiserver/agentserver charts on image
# 0.5.41 (node attach deadline; error_code on cluster_console_sessions).
#
# 0.9.0 moves the image to 0.9.0: node console through a privileged helper
# Pod. Three gates, all OFF: rbac.nodeShell, exec.node.enabled, and the
# platform permission.
#   - rbac.nodeShell grants the ServiceAccount a Role (not a ClusterRole --
#     the helper Pod lives beside the agent) scoped to THIS release's
#     namespace: create/get/list/watch/delete on pods. It also widens the
#     existing pods/exec ClusterRole grant, now gated on
#     `rbac.exec OR rbac.nodeShell`, since a node console execs into the
#     helper Pod it creates. NOT derived from exec.node, the same reasoning
#     as rbac.exec, rbac.write and rbac.readAll: the agent config can be
#     mounted from a file this chart never sees.
#   - exec.node.enabled + exec.node.nodes/image/namespace/shell/
#     maxSessionSec/maxSessions/helperReadyTimeoutSec is the owner's policy:
#     which nodes, what image, and the session limits. image has no default
#     on purpose -- any image with `sleep` and `nsenter` works, and the
#     operator names one this cluster's nodes can pull.
#   - the platform's own cluster:node_console permission at admin level is
#     checked outside this chart entirely.
# Also new: POD_NAME/POD_NAMESPACE via the downward API, unconditional, so
# the helper Pod can carry an ownerReference back to the agent Pod (helpers
# are garbage-collected with the agent when exec.node.namespace is empty).
# Inert when exec.node is off.
#
# 0.8.0 moves the image to 0.8.0: the agent answers pod console sessions over
# a stream of its own -- opening a shell in a running container, resizing it,
# and resuming it across a proxy cut inside resume_window_sec. Two gates,
# both OFF:
#   - rbac.exec grants the ServiceAccount exactly what a console needs:
#     pods get (to resolve the default container) and pods/exec create (to
#     open the session). It is NOT derived from exec.pod, the same reasoning
#     as rbac.write and rbac.readAll: the agent config can be mounted from a
#     file this chart never sees, so a derived grant would render a narrow
#     Role while the policy said yes.
#   - exec.pod.enabled + exec.pod.rules is the owner's policy: which
#     namespaces, pod names and containers a session may open, passed
#     through verbatim (snake_case, the agent's keys). A rule with no fields
#     matches everything -- unlike mutate.rules, there is no separate empty-
#     grants-nothing convention here.
# Off by default in both places: rbac.exec absent leaves every exec_open
# RBAC_DENIED, and exec.pod.enabled: false refuses it before that, at the
# agent's own policy layer.
#
# 0.7.9 moves the image to 0.7.6: the agent answers mutation requests --
# patch, delete, restart, scale and create -- over the same stream it already
# streams telemetry on. Two independent gates decide every one, and both ship
# OFF:
#   - rbac.write grants the ServiceAccount the write verbs and the scale
#     subresource. It is NOT derived from mutate.rules, because the agent
#     config can be mounted from a file this chart never sees; a derived Role
#     would then be narrow while the policy said yes. Off: every write is
#     RBAC_DENIED by the customer's own API server.
#   - mutate.enabled + mutate.rules is the owner's policy, passed through
#     verbatim (snake_case, the agent's keys). A verb outside the rules is
#     POLICY_DENIED before anything touches the network. verbs is REQUIRED
#     on every rule and an empty list grants nothing -- the opposite of
#     query.rules -- and no resource entry may contain "*" in any form.
# The platform tells the two refusals apart, which is why they stay two
# flags. The handshake now advertises the capability, so a gateway older than
# the feature ignores it and a newer gateway refuses a mutation against an
# agent below 0.7.6 with an "upgrade the agent" answer, never a timeout.
# Also in 0.7.6: a rule's names: allowlist is consulted for an empty name too
# (before, an empty name skipped it and only client-go's own "name is
# required" stood in the way).
#
# 0.7.6 changes no image and one template line's worth of nothing: it finishes
# values.schema.json. 0.7.5 described the collect.* passthrough lists and the
# chart keys immediately around them; everything else that lands in the agent's
# config file -- agent, gateway, buffer, observability, log -- was still
# undescribed, so `--set gateway.dialTimeout=30` installed and the agent exited
# before it connected, and `--set gateway.dialTimout=5s` rendered nothing at all
# while reading like a setting that had taken effect. Those blocks are now
# described and closed, with the types the agent's own loader wants: a duration
# is a string, a byte count an integer, a string field any scalar.
#
# It also lifts a refusal 0.7.5 shipped by mistake. Outside the rule lists the
# template QUOTES a duration, so the agent parses the value's string form and a
# bare 0 arrives as "0" -- a valid zero duration, and the ordinary way to turn a
# resync off. 0.7.5 refused `collect.state.resyncPeriod: 0`. Inside a rule list
# nothing quotes anything and a number really is fatal, so the two positions
# keep different schemas.
#
# UPGRADE: a key under gateway/buffer/observability/log that this chart does not
# define now fails the upgrade by name instead of being ignored. Every such key
# was already doing nothing -- the template never read it -- so the fix is to
# delete it or correct the spelling; nothing that was in force stops working.
# appVersion stays 0.7.3.
#
# 0.7.5 changes no template and no image either: values.schema.json now
# describes the four collect.* passthrough lists and the chart keys around
# them, the way it already described query.rules. Before this, helm refused
# `query.rules[0].labelSelector` by name while accepting
# `collect.logs.rules[0].podNames` -- the same mistake, one caught before the
# install and one only visible later as a rule collecting its whole namespace.
# The schema also refuses a duration written as a number (`pod_interval: 30`),
# which the agent rejects at startup: helm now says no instead of rendering a
# CrashLoopBackOff, and it refuses an infix `*` in a query rule's namespace or
# names, which the agent also exits on. Everything else stays as permissive as
# the agent is: a string field accepts any scalar because yaml.v3 does, a blank
# value is allowed wherever yaml.v3 reads one as "not set", and `resources` is
# required only on query.rules -- state and metrics skip validation entirely
# while disabled, so a leftover rule there still installs.
#
# UPGRADE: this is the release where a rule written with the chart's old
# camelCase examples stops installing. If `helm upgrade` refuses it naming
# podNames (or labelSelector / extraLabels -- the wording differs before and
# after helm 3.18, the key does not), rename
# those keys to pod_names / label_selector / extra_labels -- the agent never
# read the camelCase spelling, so the rule was running without that filter.
# appVersion stays 0.7.3.
#
# 0.7.4 changes no template and no image: it corrects the values.yaml examples
# for the passthrough `rules` lists. Those lists are copied into the agent's
# config with toYaml, so their keys are the agent's own snake_case config keys
# (pod_names, label_selector, extra_labels) -- the examples showed podNames /
# labelSelector / extraLabels, which the agent drops in silence, leaving a rule
# with no filter that collects everything in its namespace. appVersion stays
# 0.7.3; the startup warning for unknown keys ships with the next image.
#
# 0.7.3 changed no template either; it moved appVersion to 0.7.3, which carries
# three fixes batched since 0.7.2:
#   - max_line_bytes was applied to the wire record's Raw field only, so the
#     Message field -- the one the consumer indexes and the one Loki caps at
#     256 KiB -- went out untrimmed.
#   - retireSegment returned early when the segment file was already gone and
#     subtracted nothing from totalBytes, so an agent could believe its disk
#     budget was spent while the disk was free: the state that deadlocked the
#     queue for 37 hours.
#   - kubexa_connection_reconnects_total was never incremented in production,
#     so the only metric that measures reconnects read 0 while the same process
#     logged 550 recv errors.
# No install order constraint: the gateway is unaffected.
#
# 0.7.7 is the first chart since 0.7.3 to move appVersion, and it moves it to
# 0.7.4 -- the image that finally carries what charts 0.7.4 and 0.7.5 were
# written for. Those two fixed the chart's own values (the passthrough rule keys
# are the agent's keys -- pod_names, label_selector, extra_labels -- not the
# chart's camelCase spellings) and gave values.schema.json the same
# additionalProperties gate over collect.* that query.rules already had. The
# schema half worked the moment the chart shipped, because helm enforces it.
# The other half needed a binary: pkg/config now decodes a second time with
# KnownFields(true) and cmd/agent prints `unrecognized config key ignored` with
# the line, the key and the struct that refused it. It WARNS, it does not
# refuse -- a stale key carried across an upgrade must not put a running agent
# into CrashLoopBackOff. Before this image a camelCase key was dropped in
# silence and the rule that lost its filter collected everything in the
# namespace.
#
# No install order constraint; the gateway is unaffected. Restarting the agent
# does not lose queued telemetry -- the disk queue survives the pod, and since
# 0.7.1 the gateway requeues whatever was in flight.
#
# 0.7.8 carries image 0.7.5, the first one that scrapes anything besides the
# Metrics API. It adds two collect.metrics endpoints and the values that
# configure them:
#   - collect.metrics.cadvisor scrapes each node's kubelet directly. Targets
#     are generated from the live node list and refreshed on
#     refreshInterval, so nothing here names a node and a new node is picked
#     up without an upgrade. The ClusterRole now includes nodes/metrics --
#     without it every target answers 401.
#   - collect.metrics.kubeStateMetrics scrapes a kube-state-metrics Service,
#     but probes for the Service FIRST. An absent installation is reported as
#     `not_installed`, which is a different thing from a scrape that returned
#     nothing, and the platform shows it as a different thing.
# Both default to enabled: false. Turning cadvisor on is the one to read the
# values.yaml comment for first: caFile defaults to the ServiceAccount CA,
# which signs the API server and NOT kubelet serving certificates, so on a
# cluster without serverTLSBootstrap every cAdvisor scrape fails
# `x509: certificate signed by unknown authority` until caFile or
# insecureSkipVerify is set.
#
# It also adds an advisory series budget (collect.metrics.maxSeries) and
# reports scrape health on every heartbeat, per kind and per target. No
# install order constraint against the gateway: an older gateway ignores the
# new heartbeat field, and a newer gateway reads its ABSENCE as "this agent
# does not report scrape health" rather than as "everything is fine".
# 0.9.2 moves the image to 0.9.2: a node console attaches to the gateway
# BEFORE its helper Pod is created and waited for. The helper wait now
# runs inside the session, under its max_session clock and resume window,
# so an image pull no longer burns the gateway's attach deadline and a
# browser that leaves mid-pull ends the session through Close or the
# resume window (helper deleted either way). Two lines appear in the
# terminal while it waits ("kubexa: starting node shell helper on <node>
# (<image>)..." then "kubexa: helper ready, entering host namespaces").
# Also: the kubexa.dev/node label fits Pod validation for node names over
# 63 characters; the boot sweep lists exec.node.namespace AND the release
# namespace; exec.node with an invalid exec.pod.rules entry fails boot
# naming the section. Pairs with apiserver/agentserver charts on image
# 0.5.42, which drop their 615/620 s node deadlines back to 15/20 s --
# install THIS chart first: an older agent on a 0.5.42 gateway ends every
# uncached node open as attach_timeout.
#
version: 0.9.2
appVersion: "0.9.2"
keywords:
  - kubexa
  - observability
  - kubernetes
  - monitoring
home: https://github.com/kubexa/kubexa-agent
sources:
  - https://github.com/kubexa/kubexa-agent
maintainers:
  - name: Kubexa
    url: https://github.com/kubexa
