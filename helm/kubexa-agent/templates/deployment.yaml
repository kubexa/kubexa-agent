apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubexa-agent.fullname" . }}
  labels:
    {{- include "kubexa-agent.labels" . | nindent 4 }}
  annotations:
    kubexa.io/singleton: "true"
spec:
  # Fixed at 1: each replica runs independent collectors and would duplicate data to the gateway.
  # HA requires leader election (not implemented yet).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubexa-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.service.scrapeAnnotations }}
        # Default ON, and it is the fix for a measured incident rather than a
        # nice-to-have. The agent's own kubexa_queue_* and *_dropped_total
        # series are the ONLY place a wedged export pipeline is visible: every
        # other signal the platform has -- connection state, stream active,
        # health_status, /healthz -- reads healthy while the queue fills and
        # drops. On apexcrawl this pod ran unscraped, so when the export
        # stalled on 2026-10-26 there was no history, no alert, and no number
        # anywhere until a support bundle happened to catch the log noise 9.6
        # days later.
        #
        # The port must be the CONTAINER port: the pod-discovery job keeps a
        # pod only when prometheus.io/port equals a declared container port
        # number (keep_if_equal on __meta_kubernetes_pod_container_port_number),
        # so deriving this from anything but service.metricsPort would silently
        # drop the target. Quoted because an annotation value is a string and a
        # bare 9090 is a type error at apply time.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kubexa-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubexa-agent.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "kubexa-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/config/config.yaml
          ports:
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: KUBEXA_TENANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubexa-agent.secretName" . }}
                  key: {{ .Values.secret.existingSecretKey }}
            # Downward API: the agent's own Pod, so a node console's helper
            # Pod can carry an ownerReference to it. Unconditional and inert
            # when exec.node is off.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- $goMemLimit := include "kubexa-agent.goMemLimit" . }}
            {{- if and $goMemLimit (not (hasKey (.Values.env | default dict) "GOMEMLIMIT")) }}
            - name: GOMEMLIMIT
              value: {{ $goMemLimit | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /var/lib/kubexa
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kubexa-agent.configMapName" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubexa-agent.pvcName" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
