{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubexa-agent.fullname" . }}
  labels:
    {{- include "kubexa-agent.labels" . | nindent 4 }}
rules:
  # Cluster identity and discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  {{- if .Values.collect.logs.enabled }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Log lines are labelled with the workload that owns the pod, which means
  # reading one ReplicaSet (to reach its Deployment) or one Job (to reach its
  # CronJob) per controller — cached, so this is not a per-line call.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  {{- end }}

  {{- /*
    Read access for both the state collector (continuous watches) and live
    resource query (on-demand reads). The two are independent in the agent --
    cmd/agent/main.go builds the query executor regardless of collect.state --
    so gating these rules on collect.state.enabled alone left an installation
    with state disabled and query enabled taking RBAC_DENIED on every query.
  */ -}}
  {{- if or .Values.collect.state.enabled .Values.query.enabled }}
  - apiGroups: [""]
    resources:
      - pods
      - services
      - secrets
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - nodes
      - resourcequotas
      - limitranges
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

  # Capability discovery: enumerate every API resource in the cluster and ask
  # the API server whether this agent may read each one.
  #
  # Both are granted to system:authenticated by default (system:discovery and
  # system:basic-user), so this block changes nothing on a stock cluster. It
  # exists for hardened clusters that drop those bindings, where the agent
  # would otherwise report every resource as unreadable and the UI would
  # disable the entire catalog.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
  {{- end }}

  {{- if .Values.collect.metrics.enabled }}
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  {{- end }}

  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
