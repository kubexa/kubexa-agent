{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubexa-agent.fullname" . }}
  labels:
    {{- include "kubexa-agent.labels" . | nindent 4 }}
rules:
  {{- if .Values.rbac.readAll }}
  # Companion to a query rule with `resources: ["*"]`: the agent's own policy
  # may permit every resource, but the API server still refuses each type the
  # enumerated rules below do not name -- RBAC_DENIED with nothing in the
  # agent's config to explain it. Read-only; the agent never writes.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Cluster identity and discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  {{- if .Values.collect.logs.enabled }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Log lines are labelled with the workload that owns the pod, which means
  # reading one ReplicaSet (to reach its Deployment) or one Job (to reach its
  # CronJob) per controller — cached, so this is not a per-line call.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  {{- end }}

  {{- /*
    Read access for both the state collector (continuous watches) and live
    resource query (on-demand reads). The two are independent in the agent --
    cmd/agent/main.go builds the query executor regardless of collect.state --
    so gating these rules on collect.state.enabled alone left an installation
    with state disabled and query enabled taking RBAC_DENIED on every query.
  */ -}}
  {{- if or .Values.collect.state.enabled .Values.query.enabled }}
  - apiGroups: [""]
    resources:
      - pods
      - services
      - secrets
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - nodes
      - resourcequotas
      - limitranges
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

  # Capability discovery: enumerate every API resource in the cluster and ask
  # the API server whether this agent may read each one.
  #
  # Both are granted to system:authenticated by default (system:discovery and
  # system:basic-user), so this block changes nothing on a stock cluster. It
  # exists for hardened clusters that drop those bindings, where the agent
  # would otherwise report every resource as unreadable and the UI would
  # disable the entire catalog.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
  {{- end }}

  {{- if or .Values.collect.metrics.enabled .Values.query.enabled }}
  # Scraping writes these to the metrics backend; a live listing reads them
  # straight back through the query path. Either feature alone needs the rule.
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  {{- end }}

  {{- /*
    Both blocks below are ALSO gated on the parent collect.metrics.enabled.
    Without it a cluster with metrics collection off still granted nodes
    get/list, nodes/metrics get and services get -- standing authority for a
    collector that never starts. The child flag alone is not the feature being
    on.

    The values schema admits an explicit `cadvisor: null`, and Helm hard-errors
    on a chained field access through a nil map rather than treating it as
    false -- `.Values.collect.metrics.cadvisor.enabled` panics the whole render
    on exactly the install that leaves this block out. The parenthesized
    sub-expression sidesteps that: evaluating `(.Values.collect.metrics.cadvisor)`
    alone returns a plain nil, and `{{- if }}` treats nil as false.
  */ -}}
  {{- if and .Values.collect.metrics.enabled (.Values.collect.metrics.cadvisor).enabled }}
  # Scraping each node's kubelet directly. `nodes/metrics` is what authorizes
  # GET /metrics/cadvisor: targetsForNodes always builds a direct
  # scheme://<node InternalIP>:<port><path> URL, and the kubelet's own
  # authorizer maps that path to nodes/metrics. `nodes` itself is the LIST the
  # agent needs to discover which nodes exist -- the state/query block grants
  # it too, but this feature must not depend on either being on.
  #
  # This is the whole grant the feature needs. Nothing here routes a scrape
  # through the API server proxy, so no proxy subresource is granted; see
  # TestClusterRoleGrantsKubeletMetricsForCAdvisor for why that matters.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  {{- end }}

  {{- /*
    Same nil-safety as cadvisor above: the values schema admits an explicit
    `kubeStateMetrics: null`, so the guard reads its enabled flag through a
    parenthesized dereference rather than panicking the whole render on the
    install that leaves this block out.
  */ -}}
  {{- if and .Values.collect.metrics.enabled (.Values.collect.metrics.kubeStateMetrics).enabled }}
  # The presence probe: one GET against the kube-state-metrics Service. Without
  # it the agent cannot tell "not installed" from "unreachable", and the screen
  # would report an absent component as a broken one.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  {{- end }}

  {{- if .Values.rbac.write }}
  # rbac.write grants the wire verbs the mutation executor can issue: PATCH,
  # DELETE, RESTART and SCALE and CREATE (proto MutationVerb) map onto exactly
  # four RBAC verbs, because RESTART is a patch and SCALE is an update on the
  # */scale subresource. Enumerated over the SAME resource lists as the
  # state/query read block above, never a bare wildcard -- the mutation policy
  # rejects every wildcard resource form (see values.yaml), so the set this
  # flag needs to cover is finite by construction, and a wider grant would
  # permanently exceed anything a policy could ever use.
  #
  # This gate deliberately consults ONLY rbac.write, the same way readAll
  # above answers only to itself: the agent config can be mounted from a file
  # this chart never sees, so deriving the grant from the write policy's own
  # rule list would render a narrow Role while that policy said yes.
  # nodes is deliberately absent here, unlike the read block above: write
  # verbs on a cluster Node affect cluster capacity, not just one workload,
  # and cordon/drain -- the mutations that would actually use them -- are
  # deferred out of this phase. Do not add it back to match the read block.
  - apiGroups: [""]
    resources:
      - pods
      - services
      - secrets
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - resourcequotas
      - limitranges
      - replicationcontrollers
    verbs: ["patch", "update", "delete", "create"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["patch", "update", "delete", "create"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["patch", "update", "delete", "create"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["patch", "update", "delete", "create"]
  # The whole RBAC API group (roles, rolebindings, clusterroles,
  # clusterrolebindings) is deliberately absent here, unlike the read block
  # above -- this is not an oversight, it is a privilege-escalation hole
  # waiting to happen. Kubernetes' own escalation check permits a
  # create/patch on a Role/ClusterRole/(Cluster)RoleBinding whenever the
  # actor already holds every permission being granted, and this write
  # block's own resource set is exactly that: granting create/patch on
  # roles/clusterroles/rolebindings/clusterrolebindings here would let any
  # mutate policy bind the agent's own write powers to an arbitrary
  # subject. Do not add this apiGroup back to match the read block.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["patch", "update", "delete", "create"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["patch", "update", "delete", "create"]
  # SCALE is an update on the scale subresource, not on the resource itself --
  # the rules above do not authorize it.
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
      - replicasets/scale
    verbs: ["update"]
  - apiGroups: [""]
    resources:
      - replicationcontrollers/scale
    verbs: ["update"]
  {{- end }}

  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
