syntax = "proto3";
package agent.v1;

option go_package = "github.com/kubexa/kubexa-agent/proto/gen/go/agent/v1;agentv1";

// ResourceCatalog is a full snapshot of every API resource the agent can see
// in its cluster, with the agent's own read permission for each. It replaces
// the previous snapshot wholesale; there is no delta encoding.
//
// The catalog deliberately speaks in GVR strings rather than the ResourceKind
// enum: that enum is a closed set and cannot represent a CRD, which is the
// case this whole message exists to serve.
message ResourceCatalog {
  string fingerprint = 1;             // hash of the sorted GVR set
  int64  collected_at = 2;            // unix milliseconds
  repeated ResourceCapability entries = 3;
  repeated string failed_groups = 4;  // API groups discovery could not reach
}

message ResourceCapability {
  string group = 1;      // "" for the core group
  string version = 2;
  string resource = 3;   // plural, e.g. "deployments"
  string kind = 4;       // "Deployment"
  bool namespaced = 5;
  bool can_list = 6;
  bool can_watch = 7;
  // probe_failed means the SelfSubjectAccessReview itself errored, so can_list
  // and can_watch carry no information. It is NOT the same as being denied: a
  // wrong "denied" hides a resource and sends the operator hunting through
  // their own RBAC, while an honest "unknown" lets the UI say so.
  bool probe_failed = 8;

  // The agent's own configuration policy, independent of can_list/can_watch
  // which report the API server's RBAC answer. RBAC may permit what the
  // cluster owner's config refuses, and the UI needs to tell the two apart.
  //
  // These are per-GVR, so they answer "could any query for this type
  // succeed" -- a policy scoped to a namespace or a name prefix cannot be
  // reduced to one boolean. The agent still checks every request, so a query
  // outside the policy's namespace is refused even when policy_list is true.
  bool policy_list = 9;
  bool policy_get  = 10;

  // Write and exec answers. can_* are the API server's RBAC verdict from a
  // SelfSubjectAccessReview; policy_* are the cluster owner's config. They
  // stay separate for the same reason can_list and policy_list do: a UI that
  // cannot tell them apart sends the operator to the wrong file.
  //
  // can_patch/can_delete/can_create are probed ONLY for GVRs the mutate
  // policy names, because that set is finite -- mutate rules forbid a
  // wildcard. An unprobed entry reports false for all of them, which is the
  // same answer an agent without the feature gives.
  bool can_patch     = 11;
  bool can_delete    = 12;
  bool can_create    = 13;
  bool can_exec      = 14;  // pods and nodes only; phase B/C
  bool policy_patch  = 15;
  bool policy_delete = 16;
  bool policy_create = 17;
  bool policy_scale  = 18;
  bool policy_exec   = 19;  // phase B/C
}
