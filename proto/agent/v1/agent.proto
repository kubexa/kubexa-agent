syntax = "proto3";
package agent.v1;

import "proto/agent/v1/catalog.proto";
import "proto/agent/v1/log.proto";
import "proto/agent/v1/state.proto";
import "proto/agent/v1/metric.proto";
import "proto/common/v1/metadata.proto";

option go_package = "github.com/kubexa/kubexa-agent/proto/gen/go/agent/v1;agentv1";

// Wire-format compatibility policy:
//   - Field numbers and oneof discriminators are stable; never reuse or retype.
//   - Removed fields must use `reserved`; new capabilities use new field numbers.
//   - Superseded payloads stay on the wire with [deprecated = true].
//   - API versioning is negotiated at handshake via proto_version fields (see pkg/protoversion).

service AgentService {
  // Bidirectional stream:
  // Agent → Gateway: log/state/metric verisi
  // Gateway → Agent: config update, ack, backpressure, shutdown
  rpc Connect(stream AgentMessage) returns (stream GatewayMessage);
}

// ─── Agent → Gateway ────────────────────────────────────────────────────────

message AgentMessage {
  string                  message_id = 1; // idempotency key (uuid)
  common.v1.AgentMetadata meta       = 2;

  oneof payload {
    HandshakeRequest       handshake          = 3;
    LogBatch               logs               = 4;
    StateEvent             state              = 5;
    MetricBatch            metrics            = 6 [deprecated = true]; // use kube_metrics / prometheus_metrics
    Heartbeat              heartbeat          = 7;
    MetricsEvent           kube_metrics       = 8;
    PrometheusMetricsEvent prometheus_metrics = 9;
    ResourceCatalog        catalog            = 10;
    ResourceQueryResult    resource_query_result = 11;
  }
}

message HandshakeRequest {
  string            agent_version            = 1; // semver "1.2.3"
  string            proto_version            = 2; // preferred API version, e.g. "v1"
  string            cluster_id               = 3;
  string            tenant_token             = 4; // auth token
  AgentCapabilities caps                     = 5;
  repeated string   supported_proto_versions = 6; // versions this agent can speak (newest first)
}

message AgentCapabilities {
  bool logs    = 1;
  bool state   = 2;
  bool metrics = 3;
}

message Heartbeat {
  int64       timestamp_unix_ms = 1;
  AgentHealth health            = 2;
}

message AgentHealth {
  int64  queue_depth      = 1;
  int64  dropped_messages = 2;
  string status           = 3; // "healthy" | "degraded" | "overloaded"

  // Pre-validation counters, CUMULATIVE since process start -- not deltas.
  // A dropped heartbeat loses data permanently under a delta model and loses
  // nothing under a cumulative one. The gateway advances its own counters by
  // the difference and treats a decrease as an agent restart.
  int64 truncated_lines      = 4;
  int64 dropped_too_old      = 5;
  int64 dropped_future       = 6;
  int64 dropped_rate_limited = 7;
}

// ─── Gateway → Agent ────────────────────────────────────────────────────────

message GatewayMessage {
  string message_id = 1;

  oneof payload {
    HandshakeResponse  handshake    = 2;
    Ack                ack          = 3;
    ConfigUpdate       config       = 4;
    BackpressureSignal backpressure = 5;
    Shutdown           shutdown     = 6;
    ResourceQuery      resource_query = 7;
  }
}

message HandshakeResponse {
  bool           accepted                 = 1;
  string         session_id               = 2;
  string         server_version           = 3;
  string         rejection_reason         = 4; // accepted=false ise dolu
  ConfigSnapshot config                   = 5; // initial config
  string         proto_version            = 6; // negotiated API version, e.g. "v1"
  repeated string supported_proto_versions = 7; // gateway-supported versions (newest first)
  // The gateway acks each AgentMessage after every buffer item it produced has
  // been published, so the agent must settle its queue from Ack rather than
  // from Send returning nil.
  //
  // Default false is load-bearing, not a formality: an old gateway omits the
  // field, the agent reads false, and it keeps acking on Send -- exactly
  // today's behaviour. An agent that switched without this gate would hold
  // every item inflight until the 10-minute cap and then replay it forever.
  bool           delivery_acks            = 8;
}

message Ack {
  repeated string message_ids = 1; // batch ack
}

message BackpressureSignal {
  bool  throttle = 1;
  int32 delay_ms = 2;
}

message Shutdown {
  string reason = 1;
}

// ─── Config ─────────────────────────────────────────────────────────────────

message ConfigUpdate {
  string         config_version = 1;
  ConfigSnapshot config         = 2;
}

// ConfigSnapshot merge semantics, and they are load-bearing:
//
//   Message-typed fields are a PATCH -- nil means "unchanged".
//   Repeated fields keep their existing meaning, because proto3 cannot
//   distinguish an absent repeated field from an empty one.
//
// Without that rule each sender erases the other. kubexa-backend's
// clusterwatch reconciler sends a ConfigUpdate carrying only `watchers`, and
// the ingest-rules pusher sends one carrying only `ingest_rules`; a receiver
// that replaced the whole snapshot would let whichever arrived last delete
// the other's configuration.
message ConfigSnapshot {
  repeated LogCollectorConfig  log_collectors   = 1;
  repeated WatcherConfig       watchers         = 2;
  repeated MetricScrapeConfig  metric_scrapers  = 3;
  int32                        heartbeat_interval_sec = 4;
  int32                        batch_size             = 5;
  int32                        flush_interval_ms      = 6;
  IngestRules                  ingest_rules           = 7;
}

// IngestRules are the limits the platform's log pipeline actually enforces,
// pushed so the agent never has to guess them. Before this message the agent
// hardcoded 256 KB and matched Loki's max_line_size default by coincidence
// rather than by agreement.
//
// EVERY FIELD IS "0 = no rule pushed": the agent keeps its own compiled
// default. That is deliberately the same behaviour as a gateway too old to
// send this message at all, so there is one fallback path, not two.
//
// per_stream_* are the tenant's plan values. Unlike a tenant-wide ingestion
// rate -- which is the sum across every cluster the tenant runs and therefore
// unknowable to any single agent -- one Loki stream lives entirely on one
// agent: the chart pins replicas to 1 and there is no leader election
// (helm/kubexa-agent/values.yaml). So this one is exactly enforceable here.
message IngestRules {
  int64 max_line_bytes         = 1; // Loki max_line_size
  int64 max_sample_age_ms      = 2; // Loki reject_old_samples_max_age
  int64 max_future_skew_ms     = 3; // Loki creation_grace_period
  int64 per_stream_rate_bytes  = 4;
  int64 per_stream_burst_bytes = 5;
}

message LogCollectorConfig {
  string            id            = 1;
  string            namespace     = 2;
  repeated string   pod_selectors = 3; // label selectors
  repeated string   containers    = 4; // boş ise tümü
  bool              follow        = 5;
  int32             tail_lines    = 6;
}

message WatcherConfig {
  string                 id         = 1;
  string                 namespace  = 2; // boş ise tüm namespace
  repeated ResourceKind  kinds      = 3;
  int32                  resync_sec = 4;
  // GVRs to watch, including CRDs. `kinds` cannot express a CRD (it is a
  // closed enum), so this is the field demand-driven watches use. An agent
  // that understands both treats them as a union.
  repeated ResourceRef   resources  = 5;
}

// ResourceRef names one API resource the way the dynamic client addresses it.
message ResourceRef {
  string group    = 1; // "" for the core group
  string version  = 2;
  string resource = 3; // plural, e.g. "cronjobs"
}

message MetricScrapeConfig {
  string id              = 1;
  string endpoint        = 2; // scrape URL
  int32  interval_sec    = 3;
  map<string, string> extra_labels = 4;
}

// ─── Live resource query ────────────────────────────────────────────────────

// ResourceQuery asks the agent to read one resource type right now and reply.
// It is the pull counterpart to WatcherConfig: nothing is started, nothing is
// remembered, and the agent holds no state between queries.
message ResourceQuery {
  string      query_id       = 1;  // correlates the reply; opaque to the agent
  ResourceRef ref            = 2;
  QueryVerb   verb           = 3;
  QueryView   view           = 4;
  string      namespace      = 5;  // "" = all namespaces / cluster-scoped
  string      name           = 6;  // required for GET, ignored for LIST
  string      label_selector = 7;
  string      field_selector = 8;
  int32       limit          = 9;  // page size; 0 uses the agent default
  string      continue_token = 10; // opaque Kubernetes continue token
  int32       timeout_ms     = 11; // clamped by the agent to [1s, 30s]
}

enum QueryVerb {
  QUERY_VERB_UNSPECIFIED = 0;
  QUERY_VERB_LIST        = 1;
  QUERY_VERB_GET         = 2;
}

// QueryView selects the response shape. TABLE uses the API server's own
// server-side printing, which yields kubectl's columns -- including the
// additionalPrinterColumns a CRD defines -- at a fraction of the payload size.
enum QueryView {
  QUERY_VIEW_UNSPECIFIED = 0;
  QUERY_VIEW_TABLE       = 1;
  QUERY_VIEW_FULL        = 2;
}

// ResourceQueryResult is always sent, success or failure. A gateway that has
// forgotten the query_id drops the reply; the agent never withholds one.
message ResourceQueryResult {
  string     query_id       = 1;
  QueryError error          = 2;  // when set, payload is empty
  bytes      payload        = 3;  // JSON: a meta.k8s.io/v1 Table, or an object array

  // continue_token and remaining are populated for QUERY_VIEW_FULL only.
  //
  // On QUERY_VIEW_TABLE they are always empty/zero even mid-pagination: the
  // API server carries that state inside the Table body itself, and it is
  // left there. A TABLE consumer must read metadata.continue and
  // metadata.remainingItemCount from the payload JSON. Reading an empty
  // continue_token here as "no more pages" truncates every TABLE listing at
  // its first page.
  //
  // metadata.remainingItemCount is an upper bound, not an exact count: the
  // agent drops rows the config policy's name patterns exclude, and that
  // filtering happens after the API server has already paged and counted.
  // QUERY_VIEW_FULL's remaining field carries the same caveat.
  string continue_token = 4;
  int32  remaining      = 5;

  bool truncated = 6;  // response size cap was reached
}

message QueryError {
  QueryErrorCode code    = 1;
  string         message = 2;
}

// POLICY_DENIED and RBAC_DENIED are separate on purpose: they send the
// operator to two different files -- the agent's own config versus the
// ClusterRole -- and one merged code sends half of them to the wrong one.
enum QueryErrorCode {
  QUERY_ERROR_UNSPECIFIED        = 0;
  QUERY_ERROR_POLICY_DENIED      = 1;
  QUERY_ERROR_RBAC_DENIED        = 2;
  QUERY_ERROR_NOT_FOUND          = 3;
  QUERY_ERROR_TIMEOUT            = 4;
  QUERY_ERROR_TOO_LARGE          = 5;
  QUERY_ERROR_RESOURCE_EXHAUSTED = 6;
  QUERY_ERROR_INTERNAL           = 7;
  // A continue token that outlived the resource version it names. Distinct
  // from INTERNAL because it is the one query failure the CALLER can fix, by
  // restarting the listing from the first page -- reported as INTERNAL it
  // reads as a platform fault and offers no recovery.
  QUERY_ERROR_EXPIRED            = 8;
}
