name: Helm OCI Release

on:
  push:
    branches: ["main"]
    paths:
      - "helm/**"
      - ".github/workflows/helm-oci-release.yaml"

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # GHCR push için gerekli

    env:
      CHART_PATH: helm/kubexa-agent
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Enable OCI
        run: |
          helm registry login $REGISTRY \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }}

      - name: Lint chart
        run: helm lint $CHART_PATH

      - name: Get chart name and version
        id: chart_version
        run: |
          echo "name=$(grep '^name:' $CHART_PATH/Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "version=$(grep '^version:' $CHART_PATH/Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Package chart
        run: |
          rm -rf dist && mkdir -p dist
          helm package $CHART_PATH \
            --destination dist \
            --version ${{ steps.chart_version.outputs.version }}

      # Glob değil, tam dosya adı: `helm push` ikinci argümanı remote olarak
      # okur ve fazlasını sessizce yok sayar, yani dist/ içinde ikinci bir
      # .tgz olduğu anda remote yerine o tarball geçer.
      - name: Push to GHCR (OCI)
        run: |
          helm push \
            "dist/${{ steps.chart_version.outputs.name }}-${{ steps.chart_version.outputs.version }}.tgz" \
            "oci://$REGISTRY/${IMAGE_NAMESPACE}/charts"