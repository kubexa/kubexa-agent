name: Build & Test

on:
  push:
    branches: ["main", "develop"]
    # Sürüm tag'leri de build edilmeli: metadata-action'ın
    # `type=semver` kuralı yalnızca refs/tags/* üzerinde çalışır, yani bu
    # olmadan chart'ın appVersion'ının işaret ettiği :X.Y.Z image'i hiç üretilmez.
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────
  # Go Build + Test
  # ─────────────────────────────────────────
  test:
    name: Go Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate proto
        run: make proto

      # schema/agent-config-blocks.json is generated FROM pkg/config's own
      # managed-block structs and allowlist (tools/schemagen), not hand
      # maintained -- this is what keeps it from drifting out from under
      # the backend's validator (Task 11) and the app's per-block forms
      # (Task 17). Output is deterministic (sorted keys, no version field:
      # see tools/schemagen/main.go), so a real drift is the only thing
      # that can make this diff non-empty.
      - name: Verify agent-config-blocks.json is up to date
        run: |
          go run ./tools/schemagen > /tmp/agent-config-blocks.json
          diff -u schema/agent-config-blocks.json /tmp/agent-config-blocks.json

      # TestHelmAcceptsTheShippedChart runs the real validator over
      # values.schema.json, and without helm it skips silently. The runner
      # image ships one already, so this is here to PIN it: the action's
      # default is `latest`, so CI would drift with whatever helm ships next.
      # 3.19 and 4.x share a validator and word their refusals identically;
      # helm before 3.18 does not, which is what the pin holds still.
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: make build

      # v1.x linters are built with older Go; go 1.26 in go.mod needs golangci-lint v2+.
      # v2.11.4 cannot typecheck this module at all under a current Go
      # toolchain -- it fails to import "fmt" itself (internal/goarch export
      # data is a newer version than v2.11.4's go/importer supports), which
      # is blindness, not a clean run, and would pass a tag build without
      # having checked anything. Pinned EXACT at v2.14.0, the first version
      # verified to typecheck this tree: the action's own default is
      # "latest", and an unpinned lint version would drift with whatever
      # golangci-lint ships next, on every build.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Test
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # ─────────────────────────────────────────
  # Docker Image → GHCR
  # ─────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    # If this job fails with
    #   ERROR: failed to push ghcr.io/kubexa/<image>:main:
    #          denied: permission_denied: write_package
    # it is NOT a permission problem and nothing needs changing: RE-RUN THE JOB.
    # Measured 2026-11-09 -- three such failures across kubexa-agent and
    # kubexa-app in half an hour, and each one succeeded unchanged on a lone
    # re-run, same commit, same token, same tag.
    #
    # The obvious theory was a collision between the two runs that
    # `git push origin main vX.Y.Z` starts, since the triggers above cover both
    # refs and both runs write to one GHCR package. It is WRONG, and the two
    # readings that killed it are worth keeping so nobody spends the evening on
    # it again: kubexa-app failed with no other run pushing that package at all
    # (so a collision is not necessary), and on 2026-10-20 kubexa-app pushed
    # main and a tag in the SAME SECOND with both runs green (so it is not
    # sufficient). A job-level `concurrency` group was committed on that theory
    # and then removed again.
    #
    # What is actually established: the error is intermittent, it misnames its
    # own cause, and a retry clears it. A retry wrapper around the push is the
    # open option; it needs a third-party action, so it is a decision rather
    # than a cleanup.

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # git describe tag geçmişini görmeli

      # buildinfo.Version'ı `make build` ile aynı şekilde türetir. github.sha
      # geçmek, agent'ın kendi sürümünü 40 karakterlik bir SHA olarak
      # bildirmesine yol açıyordu; semver bekleyen bir sürüm kapısı bunu
      # ayrıştıramaz.
      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 added 2026-10-13. This image matters most of the five,
          # because it is the only one that runs in the CUSTOMER's cluster: an
          # amd64-only agent cannot be installed on an arm64 node pool
          # (Graviton, Ampere) at all, which is a class of cluster we would be
          # asked to monitor.
          #
          # This required real Dockerfile changes, not just this line: the
          # builder had no --platform=$BUILDPLATFORM and GOARCH was hardcoded
          # to amd64, so a second platform here would have published an arm64
          # manifest holding an amd64 binary. The Dockerfile now
          # cross-compiles and fails the build if the two disagree.
          #
          # No QEMU step: the Go build runs on the BUILDPLATFORM, the runtime
          # stage is distroless with only COPY, and the architecture guard
          # reads a COPY'd reference rather than running anything in the
          # target architecture.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max