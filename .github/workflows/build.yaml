name: Build & Test

on:
  push:
    branches: ["main", "develop"]
    # Sürüm tag'leri de build edilmeli: metadata-action'ın
    # `type=semver` kuralı yalnızca refs/tags/* üzerinde çalışır, yani bu
    # olmadan chart'ın appVersion'ının işaret ettiği :X.Y.Z image'i hiç üretilmez.
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────
  # Go Build + Test
  # ─────────────────────────────────────────
  test:
    name: Go Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate proto
        run: make proto

      # TestHelmAcceptsTheShippedChart runs the real validator over
      # values.schema.json, and without helm it skips silently. The runner
      # image ships one already, so this is here to PIN it: the action's
      # default is `latest`, which would move CI onto helm 4 while operators
      # install with helm 3, and the two validators word their refusals
      # differently.
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: make build

      # v1.x linters are built with older Go; go 1.26 in go.mod needs golangci-lint v2+.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Test
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # ─────────────────────────────────────────
  # Docker Image → GHCR
  # ─────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # git describe tag geçmişini görmeli

      # buildinfo.Version'ı `make build` ile aynı şekilde türetir. github.sha
      # geçmek, agent'ın kendi sürümünü 40 karakterlik bir SHA olarak
      # bildirmesine yol açıyordu; semver bekleyen bir sürüm kapısı bunu
      # ayrıştıramaz.
      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max