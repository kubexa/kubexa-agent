name: Helm Release

on:
  push:
    branches: ["main"]
    paths:
      - "helm/**"
      - ".github/workflows/helm-release.yaml"

  # manuel tetikleme
  workflow_dispatch:

jobs:
  release:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest

    permissions:
      contents: write  # helm-charts repo'ya push için

    steps:
      - name: Checkout kubexa-agent
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Lint chart
        run: helm lint helm/kubexa-agent

      - name: Package chart
        run: |
          rm -rf dist && mkdir -p dist
          NAME=$(grep '^name:' helm/kubexa-agent/Chart.yaml | awk '{print $2}')
          VERSION=$(grep '^version:' helm/kubexa-agent/Chart.yaml | awk '{print $2}')
          helm package helm/kubexa-agent \
            --destination dist \
            --version "$VERSION"
          echo "CHART_TGZ=dist/$NAME-$VERSION.tgz" >> $GITHUB_ENV

      - name: Checkout helm-charts repo
        uses: actions/checkout@v4
        with:
          repository: kubexa/helm-charts   # ← ayrı repo
          token: ${{ secrets.HELM_CHARTS_TOKEN }}
          path: helm-charts-repo

      # Glob değil, sadece bu koşuda paketlenen sürüm: dist/ içindeki eski bir
      # tarball, aksi halde `helm repo index` tarafından yayınlanır.
      - name: Copy chart package
        run: cp "$CHART_TGZ" helm-charts-repo/

      # --merge mevcut girdileri olduğu gibi taşır; yalnızca yeni sürüm eklenir.
      # Onsuz index her koşuda sıfırdan üretilir ve yayınlanmış tüm sürümlerin
      # `created` damgası o koşunun saatine eziliyordu — 0.1.0 dün çıkmış gibi
      # görünüyordu.
      #
      # Dikkat: bir sürüm bilerek yayından kaldırıldığında --merge onu eski
      # index'ten geri getirir. Öyle bir durumda index'i elle, --merge'süz
      # yeniden üretip commit'leyin; sonraki koşular kaldırılmış hâli taşır.
      - name: Update helm repo index
        run: |
          cd helm-charts-repo
          if [ -f index.yaml ]; then
            helm repo index . \
              --url https://kubexa.github.io/helm-charts \
              --merge index.yaml
          else
            helm repo index . --url https://kubexa.github.io/helm-charts
          fi

      - name: Push to helm-charts repo
        run: |
          cd helm-charts-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: release kubexa-agent chart"
          git push